name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install package
        run: python -m pip install .
      - name: Verify installed CLI and packaged templates
        run: |
          agentic-bootstrap --version
          agentic-bootstrap init --platform all --dry-run --yes --target "${RUNNER_TEMP}/package-smoke"
      - name: Run unit, integration, and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate repository
        env:
          PYTHONPATH: src
        run: python -m agentic_bootstrap validate --target .
