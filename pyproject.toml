[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-bootstrap"
version = "0.1.0"
description = "Provider-neutral bootstrap for AI-assisted software projects"
requires-python = ">=3.11"
authors = [{ name = "Mandala" }]

[project.scripts]
agentic-bootstrap = "agentic_bootstrap.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_bootstrap = [
  "templates/**/*.md",
  "templates/**/*.json",
  "templates/**/*.toml",
  "templates/**/*.yml",
  "templates/**/*.yaml",
  "templates/**/*.sh",
  "templates/**/*.py",
]

[tool.unittest]
start-directory = "tests"
